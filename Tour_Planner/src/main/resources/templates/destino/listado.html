<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin - Gestión de Destinos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar('mdestinos')}"></div>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2><i class="bi bi-geo-alt text-primary"></i> Gestión de Destinos</h2>
            <p class="text-muted">
                Bienvenido, <span th:text="${session.fullName}">Admin</span>
                (<span th:text="${session.tipo}">admin</span>)
            </p>
        </div>
        <div>
            <a th:href="@{/destino/nuevo}" class="btn btn-primary me-2">
                <i class="bi bi-plus-circle me-2"></i>Nuevo Destino
            </a>
        </div>
    </div>

    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card shadow-sm">
        <div class="card-header"><strong>Destinos registrados</strong></div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Destino</th>
                            <th>País</th>
                            <th>Ciudad</th>
                            <th>Categoría</th>
                            <th>Popularidad</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="destino : ${lstDestinos}">
                            <td th:text="${destino.idDestino}">1</td>
                            <td th:text="${destino.nombre}">Nombre</td>
                            <td th:text="${destino.pais}">País</td>
                            <td th:text="${destino.ciudad}">Ciudad</td>
                            <td th:text="${destino.categoria}">Categoría</td>
                            <td th:text="${destino.popularidad}">0</td>
                            <td>
                                <span th:class="${destino.estado} ? 'badge bg-success' : 'badge bg-secondary'"
                                      th:text="${destino.estadoDescripcion}">Activo</span>
                            </td>
                            <td class="text-nowrap">
                                <a th:href="@{/destino/edicion/{id}(id=${destino.idDestino})}"
                                   class="btn btn-sm btn-warning" title="Editar">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <form class="d-inline" method="post" th:action="@{/destino/cambiar-activo}">
                                    <input type="hidden" name="id" th:value="${destino.idDestino}">
                                    <button type="submit" class="btn btn-sm"
                                            th:classappend="${destino.estado} ? 'btn-danger' : 'btn-success'"
                                            th:title="${destino.estado} ? 'Desactivar' : 'Activar'"
                                            onclick="return confirm('¿Cambiar el estado de este destino?');">
                                        <i class="bi"
                                           th:classappend="${destino.estado} ? 'bi-slash-circle' : 'bi-check-circle'"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(lstDestinos)}">
                            <td colspan="8" class="text-center text-muted">No hay destinos registrados.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
