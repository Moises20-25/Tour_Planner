<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nuevo destino - Planes Tours</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container mt-4">
    <div class="mb-4">
        <h2><i class="bi bi-geo-alt text-primary"></i> Nuevo destino</h2>
        <p class="text-muted">Complete la información del destino turístico.</p>
    </div>

    <div class="card shadow-sm">
        <div class="card-header"><strong>Información del destino</strong></div>
        <div class="card-body">
            <form th:action="@{/destino/registrar}" th:object="${destino}" method="post">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Nombre del destino</label>
                        <input type="text" class="form-control" th:field="*{nombre}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">País</label>
                        <input type="text" class="form-control" th:field="*{pais}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Ciudad</label>
                        <input type="text" class="form-control" th:field="*{ciudad}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Categoría</label>
                        <select class="form-select" th:field="*{categoria}" required>
                            <option value="">Seleccione una categoría</option>
                            <option value="playa">Playa</option>
                            <option value="aventura">Aventura</option>
                            <option value="cultural">Cultural</option>
                            <option value="urbano">Urbano</option>
                            <option value="naturaleza">Naturaleza</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Popularidad</label>
                        <input type="number" class="form-control" th:field="*{popularidad}" min="0" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Imagen principal</label>
                        <input type="text" class="form-control" th:field="*{imagenPrincipal}"
                               placeholder="ejemplo.jpg">
                    </div>
                    <div class="col-12 mb-3">
                        <label class="form-label">Descripción</label>
                        <textarea class="form-control" rows="4" th:field="*{descripcion}" required></textarea>
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-save"></i> Guardar
                    </button>
                    <a th:href="@{/destino/listado}" class="btn btn-secondary">
                        <i class="bi bi-arrow-left"></i> Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
