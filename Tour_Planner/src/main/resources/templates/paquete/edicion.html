<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editar paquete - Planes Tours</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container mt-4">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h3 class="mb-0">Editar Paquete</h3>
        </div>
        <div class="card-body">
            <form th:action="@{/paquete/guardar}" th:object="${paquete}" method="post">
                <input type="hidden" th:field="*{idPaquete}">

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Nombre</label>
                        <input type="text" class="form-control" th:field="*{nombre}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Precio</label>
                        <input type="number" class="form-control" th:field="*{precio}" min="0" step="0.01" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Precio original</label>
                        <input type="number" class="form-control" th:field="*{precioOriginal}" min="0" step="0.01">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Destino</label>
                        <select class="form-select" th:field="*{destino}">
                            <option value="">-- Sin destino --</option>
                            <option th:each="d : ${lstDestinos}"
                                    th:value="${d.idDestino}"
                                    th:text="${d.nombre}">Destino</option>
                        </select>
                    </div>
                    <div class="col-12 mb-3">
                        <label class="form-label">Descripción</label>
                        <textarea class="form-control" rows="3" th:field="*{descripcion}"></textarea>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Región</label>
                        <select class="form-select" th:field="*{region}" required>
                            <option value="">Seleccione una región</option>
                            <option value="america">América</option>
                            <option value="europa">Europa</option>
                            <option value="asia">Asia</option>
                            <option value="africa">África</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Categoría</label>
                        <select class="form-select" th:field="*{categoria}" required>
                            <option value="">Seleccione una categoría</option>
                            <option value="playa">Playa</option>
                            <option value="aventura">Aventura</option>
                            <option value="cultural">Cultural</option>
                            <option value="urbano">Urbano</option>
                            <option value="naturaleza">Naturaleza</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Días</label>
                        <input type="number" class="form-control" th:field="*{dias}" min="1" max="30" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Viajeros</label>
                        <input type="number" class="form-control" th:field="*{viajeros}" min="0">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Imagen</label>
                        <input type="text" class="form-control" th:field="*{imagen}" placeholder="Ej: machu-picchu-peru.jpg">
                    </div>
                    <div class="col-md-6 mb-3">
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" th:field="*{descuento}">
                            <label class="form-check-label" for="descuento">Tiene descuento</label>
                        </div>
                        <div class="form-check mt-2">
                            <input type="checkbox" class="form-check-input" th:field="*{destacado}">
                            <label class="form-check-label" for="destacado">Paquete destacado</label>
                        </div>
                    </div>
                </div>

                <div class="d-flex justify-content-between mt-3">
                    <a th:href="@{/paquete/listado}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary">Actualizar</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
