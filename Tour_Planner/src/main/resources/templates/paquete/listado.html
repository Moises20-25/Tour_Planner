<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin - Gestión de Paquetes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar('mpaquetes')}"></div>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2><i class="bi bi-box-seam text-primary"></i> Gestión de Paquetes</h2>
            <p class="text-muted">
                Bienvenido, <span th:text="${session.fullName}">Admin</span>
                (<span th:text="${session.tipo}">admin</span>)
                | Total: <span th:text="${#lists.size(lstPaquetes)}">0</span> paquetes
            </p>
        </div>
        <div>
            <a th:href="@{/paquete/nuevo}" class="btn btn-primary me-2">
                <i class="bi bi-plus-circle me-2"></i>Nuevo Paquete
            </a>
           
        </div>
    </div>

    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <!-- Filtros -->
    <div class="card shadow-sm mb-3">
        <div class="card-body">
            <form method="get" th:action="@{/paquete/listado}" th:object="${filter}" class="row g-2 align-items-end">
                <div class="col-md-3">
                    <label class="form-label">Región</label>
                    <select class="form-select" th:field="*{region}">
                        <option value="">-- Todas --</option>
                        <option value="america">América</option>
                        <option value="europa">Europa</option>
                        <option value="asia">Asia</option>
                        <option value="africa">África</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Categoría</label>
                    <select class="form-select" th:field="*{categoria}">
                        <option value="">-- Todas --</option>
                        <option value="playa">Playa</option>
                        <option value="aventura">Aventura</option>
                        <option value="cultural">Cultural</option>
                        <option value="urbano">Urbano</option>
                        <option value="naturaleza">Naturaleza</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Destino</label>
                    <select class="form-select" th:field="*{idDestino}">
                        <option value="">-- Todos --</option>
                        <option th:each="d : ${lstDestinos}"
                                th:value="${d.idDestino}"
                                th:text="${d.nombre}">Destino</option>
                    </select>
                </div>
                <div class="col-md-3 d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-funnel"></i> Filtrar
                    </button>
                    <a th:href="@{/paquete/listado}" class="btn btn-outline-secondary">Limpiar</a>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-header"><strong>Paquetes registrados</strong></div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Paquete</th>
                            <th>Destino</th>
                            <th>Región</th>
                            <th>Categoría</th>
                            <th>Precio</th>
                            <th>Días</th>
                            <th>Oferta</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="paquete : ${lstPaquetes}">
                            <td th:text="${paquete.idPaquete}">1</td>
                            <td><strong th:text="${paquete.nombre}">Paquete</strong></td>
                            <td th:text="${paquete.destino != null} ? ${paquete.destino.nombre} : '-'">Destino</td>
                            <td>
                                <span class="badge bg-secondary"
                                      th:text="${paquete.region != null} ? ${#strings.toUpperCase(paquete.region)} : '-'">REGIÓN</span>
                            </td>
                            <td>
                                <span class="badge bg-info"
                                      th:text="${paquete.categoria != null} ? ${#strings.toUpperCase(paquete.categoria)} : '-'">CATEGORÍA</span>
                            </td>
                            <td class="text-primary fw-bold" th:text="'$' + ${paquete.precio}">$0</td>
                            <td th:text="${paquete.dias}">0</td>
                            <td>
                                <span th:if="${paquete.descuento}" class="badge bg-danger">OFERTA</span>
                                <span th:unless="${paquete.descuento}" class="badge bg-secondary">-</span>
                            </td>
                            <td class="text-nowrap">
                                <a th:href="@{/paquete/edicion/{id}(id=${paquete.idPaquete})}"
                                   class="btn btn-warning btn-sm me-1" title="Editar">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <form class="d-inline" method="post" th:action="@{/paquete/eliminar}">
                                    <input type="hidden" name="id" th:value="${paquete.idPaquete}">
                                    <button type="submit" class="btn btn-danger btn-sm" title="Eliminar"
                                            onclick="return confirm('¿Está seguro de eliminar este paquete?');">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(lstPaquetes)}">
                            <td colspan="9" class="text-center text-muted">No hay paquetes para mostrar.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
