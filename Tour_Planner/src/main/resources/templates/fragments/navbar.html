<nav th:fragment="navbar(paginaActiva)"
     xmlns:th="http://www.thymeleaf.org"
     class="navbar navbar-expand-lg bg-white shadow-sm">
    <div class="container">
        <a class="navbar-brand text-primary fw-bold" th:href="@{/}">
            <img th:src="@{/assets/imagenes/logo.png}"
                 alt="Tour Planner"
                 width="42"
                 height="42">
            Tour Planner
        </a>

        <div class="navbar-nav ms-auto align-items-lg-center">
            <a class="nav-link"
               th:href="@{/}"
               th:classappend="${paginaActiva == 'inicio'} ? ' active' : ''">
                Inicio
            </a>
            <a class="nav-link"
               th:href="@{/asesores}"
               th:classappend="${paginaActiva == 'asesores'} ? ' active' : ''">
                Asesores
            </a>
            <a class="nav-link"
               th:href="@{/destinos}"
               th:classappend="${paginaActiva == 'destinos'} ? ' active' : ''">
                Destinos
            </a>
            <a class="nav-link"
               th:href="@{/paquetes}"
               th:classappend="${paginaActiva == 'paquetes'} ? ' active' : ''">
                Paquetes
            </a>

            <!-- Solo administrador -->
            <a class="nav-link"
               th:if="${session.tipo == 'admin'}"
               th:href="@{/paquete/listado}"
               th:classappend="${paginaActiva == 'mpaquetes'} ? ' active' : ''">
                Mant. Paquetes
            </a>
            <a class="nav-link"
               th:if="${session.tipo == 'admin'}"
               th:href="@{/destino/listado}"
               th:classappend="${paginaActiva == 'mdestinos'} ? ' active' : ''">
                Mant. Destinos
            </a>
            <a class="nav-link"
               th:if="${session.tipo == 'admin'}"
               th:href="@{/servicio/listado}"
               th:classappend="${paginaActiva == 'mservicios'} ? ' active' : ''">
                Mant. Servicios
            </a>

            <!-- Sin sesión -->
            <a class="btn btn-primary ms-lg-2"
               th:if="${session.fullName == null}"
               th:href="@{/login}">
                Iniciar sesión
            </a>

            <!-- Con sesión -->
            <a class="btn btn-outline-danger ms-lg-2"
               th:if="${session.fullName != null}"
               th:href="@{/cerrar-sesion}">
                Cerrar sesión
            </a>
        </div>
    </div>
</nav>
