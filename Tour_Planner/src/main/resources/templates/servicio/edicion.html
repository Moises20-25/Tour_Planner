<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editar servicio - Planes Tours</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container mt-4">
    <div class="mb-4">
        <h2><i class="bi bi-briefcase"></i> Editar servicio</h2>
        <p class="text-muted">Complete la información del servicio turístico.</p>
    </div>

    <div class="card shadow-sm">
        <div class="card-header"><strong>Información del servicio</strong></div>
        <div class="card-body">
            <form th:action="@{/servicio/guardar}" th:object="${servicio}" method="post">
                <input type="hidden" th:field="*{idServicio}">
                <input type="hidden" th:field="*{disponibilidad}">

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Tipo de servicio</label>
                        <select class="form-select" th:field="*{tipo}" required>
                            <option value="">Seleccione un tipo</option>
                            <option value="vuelo">Vuelo</option>
                            <option value="hotel">Hotel</option>
                            <option value="tour">Tour</option>
                            <option value="traslado">Traslado</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Nombre</label>
                        <input type="text" class="form-control" th:field="*{nombre}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Precio</label>
                        <input type="number" class="form-control" th:field="*{precio}" step="0.01" min="0" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Stock</label>
                        <input type="number" class="form-control" th:field="*{stock}" min="0" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Imagen</label>
                        <input type="text" class="form-control" th:field="*{imagen}" placeholder="imagen.jpg">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">ID del proveedor</label>
                        <input type="text" class="form-control" th:field="*{idProveedor}">
                    </div>
                    <div class="col-12 mb-3">
                        <label class="form-label">Descripción</label>
                        <textarea class="form-control" rows="4" th:field="*{descripcion}" required></textarea>
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-save"></i> Guardar
                    </button>
                    <a th:href="@{/servicio/listado}" class="btn btn-secondary">
                        <i class="bi bi-arrow-left"></i> Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
