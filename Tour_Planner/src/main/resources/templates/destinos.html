<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/layout :: layoutBase('Destinos | Tour Planner', 'destinos', ~{::contenido})}">
<body>
<div th:fragment="contenido">

<main class="container my-5">
    <h1 class="mb-4">Destinos</h1>

    <form method="get" th:action="@{/destinos}" class="row g-2 mb-4">
        <div class="col-md-6">
            <input class="form-control" type="search" name="filtro"
                   placeholder="Buscar por nombre, país o ciudad"
                   th:value="${filtro}">
        </div>
        <div class="col-md-4">
            <select class="form-select" name="categoria">
                <option value="">Todas las categorías</option>
                <option value="playa" th:selected="${categoriaSeleccionada == 'playa'}">Playa</option>
                <option value="aventura" th:selected="${categoriaSeleccionada == 'aventura'}">Aventura</option>
                <option value="cultural" th:selected="${categoriaSeleccionada == 'cultural'}">Cultural</option>
                <option value="urbano" th:selected="${categoriaSeleccionada == 'urbano'}">Urbano</option>
                <option value="naturaleza" th:selected="${categoriaSeleccionada == 'naturaleza'}">Naturaleza</option>
            </select>
        </div>
        <div class="col-md-2">
            <button class="btn btn-primary w-100" type="submit">Buscar</button>
        </div>
    </form>

    <p th:if="${#lists.isEmpty(destinos)}" class="alert alert-info">
        No se encontraron destinos.
    </p>

    <div class="row g-4">
        <div class="col-md-4" th:each="destino : ${destinos}">
            <article class="card h-100">
                <img class="card-img-top" style="height:210px; object-fit:cover"
                     th:src="@{/assets/imagenes/{archivo}(archivo=${destino.imagenPrincipal})}"
                     th:alt="${destino.nombre}">
                <div class="card-body">
                    <h2 class="h5" th:text="${destino.nombre}">Destino</h2>
                    <p class="text-muted">
                        <span th:text="${destino.ciudad}">Ciudad</span>,
                        <span th:text="${destino.pais}">País</span>
                    </p>
                    <p th:text="${destino.descripcion}">Descripción</p>
                    <span class="badge bg-primary" th:text="${destino.categoria}">Categoría</span>
                </div>
            </article>
        </div>
    </div>
</main>

</div>
</body>
</html>
