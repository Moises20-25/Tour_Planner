<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reservar paquete | Tour Planner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar('paquetes')}"></div>

<main class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <a class="btn btn-link px-0 mb-3" th:href="@{/paquetes}">← Volver a paquetes</a>

            <section class="card mb-4">
                <img class="card-img-top" style="height:260px; object-fit:cover"
                     th:src="@{/assets/imagenes/{archivo}(archivo=${paquete.imagen})}"
                     th:alt="${paquete.nombre}">
                <div class="card-body">
                    <h1 class="h3" th:text="${paquete.nombre}">Paquete</h1>
                    <p th:text="${paquete.descripcion}">Descripción del paquete</p>
                    <p class="mb-1">
                        <span th:text="${paquete.dias}">0</span> días ·
                        <span th:text="${paquete.region}">Región</span>
                    </p>
                    <strong>
                        S/ <span th:text="${#numbers.formatDecimal(paquete.precio, 1, 2)}">0.00</span>
                    </strong>
                </div>
            </section>
		
			<div th:if="${mensaje}" class="alert alert-success" role="status"
			     th:text="${mensaje}"></div>
			<div th:if="${error}" class="alert alert-danger" role="alert"
			     th:text="${error}"></div>
			
            <section class="card">
                <div class="card-body">
                    <h2 class="h4 mb-4">Datos para tu viaje</h2>
                    <form method="post"
                          th:action="@{/reservar/{id}(id=${paquete.idPaquete})}"
                          th:object="${reservaForm}">
                        <div class="mb-3">
                            <label class="form-label" for="nombre">Nombre completo</label>
                            <input class="form-control" id="nombre" type="text"
                                   th:field="*{nombre}" maxlength="100" required>
                            <div class="text-danger small" th:if="${#fields.hasErrors('nombre')}"
                                 th:errors="*{nombre}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="correo">Correo electrónico</label>
                            <input class="form-control" id="correo" type="email"
                                   th:field="*{correo}" maxlength="254" required>
                            <div class="text-danger small" th:if="${#fields.hasErrors('correo')}"
                                 th:errors="*{correo}"></div>
                        </div>

                        <div class="row">
                            <div class="col-md-7 mb-3">
                                <label class="form-label" for="fechaViaje">Fecha de viaje</label>
                                <input class="form-control" id="fechaViaje" type="date"
                                       th:field="*{fechaViaje}" required>
                                <div class="text-danger small"
                                     th:if="${#fields.hasErrors('fechaViaje')}"
                                     th:errors="*{fechaViaje}"></div>
                            </div>
                            <div class="col-md-5 mb-3">
                                <label class="form-label" for="viajeros">Número de viajeros</label>
                                <input class="form-control" id="viajeros" type="number"
                                       th:field="*{viajeros}" min="1" max="10" required>
                                <div class="text-danger small"
                                     th:if="${#fields.hasErrors('viajeros')}"
                                     th:errors="*{viajeros}"></div>
                            </div>
                        </div>

                        <button class="btn btn-primary w-100 mt-2" type="submit">
                            Reservar
                        </button>
                    </form>
                </div>
            </section>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
