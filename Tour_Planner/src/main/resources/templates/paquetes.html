<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Paquetes | Tour Planner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar('paquetes')}"></div>

<main class="container my-5">
    <h1 class="mb-4">Paquetes de viaje</h1>

    <form method="get" th:action="@{/paquetes}" class="row g-2 mb-4">
        <div class="col-md-5">
            <select class="form-select" name="region">
                <option value="">Todas las regiones</option>
                <option value="america" th:selected="${regionSeleccionada == 'america'}">América</option>
                <option value="europa" th:selected="${regionSeleccionada == 'europa'}">Europa</option>
                <option value="asia" th:selected="${regionSeleccionada == 'asia'}">Asia</option>
                <option value="africa" th:selected="${regionSeleccionada == 'africa'}">África</option>
                <option value="oceania" th:selected="${regionSeleccionada == 'oceania'}">Oceanía</option>
            </select>
        </div>
        <div class="col-md-5">
            <select class="form-select" name="categoria">
                <option value="">Todas las categorías</option>
                <option value="playa" th:selected="${categoriaSeleccionada == 'playa'}">Playa</option>
                <option value="aventura" th:selected="${categoriaSeleccionada == 'aventura'}">Aventura</option>
                <option value="cultural" th:selected="${categoriaSeleccionada == 'cultural'}">Cultural</option>
                <option value="urbano" th:selected="${categoriaSeleccionada == 'urbano'}">Urbano</option>
                <option value="naturaleza" th:selected="${categoriaSeleccionada == 'naturaleza'}">Naturaleza</option>
            </select>
        </div>
        <div class="col-md-2">
            <button class="btn btn-primary w-100" type="submit">Filtrar</button>
        </div>
    </form>

    <p th:if="${#lists.isEmpty(paquetes)}" class="alert alert-info">
        No se encontraron paquetes con esos filtros.
    </p>

    <div class="row g-4">
        <div class="col-md-4" th:each="paquete : ${paquetes}">
            <article class="card h-100">
                <img class="card-img-top" style="height:210px; object-fit:cover"
                     th:src="@{/assets/imagenes/{archivo}(archivo=${paquete.imagen})}"
                     th:alt="${paquete.nombre}">
                <div class="card-body">
                    <h2 class="h5" th:text="${paquete.nombre}">Paquete</h2>
                    <p th:text="${paquete.descripcion}">Descripción</p>
                    <p>
                        Región: <span th:text="${paquete.region}">región</span><br>
                        Categoría: <span th:text="${paquete.categoria}">categoría</span><br>
                        Duración: <span th:text="${paquete.dias}">0</span> días
                    </p>
                    <strong>
                        S/ <span th:text="${#numbers.formatDecimal(paquete.precio, 1, 2)}">0.00</span>
                    </strong>
                    <a class="btn btn-primary w-100 mt-3"
                       th:href="@{/reservar/{id}(id=${paquete.idPaquete})}">
                        Reservar
                    </a>
                </div>
            </article>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
