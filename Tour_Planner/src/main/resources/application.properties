spring.application.name=tour-planner

# Server configuration
# If server.port is not specified, Spring Boot uses port 8080 by default.
# server.port=8080

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# MySQL database configuration
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/tour_planner?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

# Locale configuration
spring.web.locale=es_PE
spring.web.locale-resolver=fixed